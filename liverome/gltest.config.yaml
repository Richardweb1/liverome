# Config gltest pour Liverome
# Docs: https://pypi.org/project/genlayer-test/

network: localnet          # localnet pour dev rapide, studionet pour se rapprocher du réel
contracts_dir: contracts
default_contract: contracts/liverome.py

# Décommenter pour figer la date/heure du contrat pendant les tests
# (utile pour tester le cooldown de rebalance() de façon déterministe)
# genvm_datetime: "2026-01-01T00:00:00Z"

validators:
  count: 3
  provider: openai
  model: gpt-4o
  config:
    temperature: 0.7
    max_tokens: 1000
  plugin: openai-compatible
  plugin_config:
    api_key_env_var: OPENAI_API_KEY
